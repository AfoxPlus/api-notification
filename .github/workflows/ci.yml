name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/serviceAccountKey.json
    steps:
      - uses: actions/checkout@v4
      - name: Decode Google credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_SECRET: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_SECRET" ]; then
            echo "::error::Missing GOOGLE_APPLICATION_CREDENTIALS secret"
            exit 1
          fi

          if printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_SECRET" | base64 --decode > "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null \
            && python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null; then
            echo "Loaded base64-encoded Google credentials"
          else
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_SECRET" > "$GOOGLE_APPLICATION_CREDENTIALS"
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
            echo "Loaded plain JSON Google credentials"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
